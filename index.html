  <script>/* מראה (בהיר/כהה) לפני הציור הראשון. בלי ערך = אוטומטי (הגדרת המכשיר). */
    try { var t0 = localStorage.getItem('brande_theme'); if (t0 === 'light' || t0 === 'dark') { document.documentElement.setAttribute('data-theme', t0);
      Array.prototype.forEach.call(document.querySelectorAll('meta[name="theme-color"]'), function (m) { m.setAttribute('content', t0 === 'dark' ? '#000000' : '#F2F2F7'); }); } } catch (e) {}</script>
  <title>Brande CashFlow</title>
  <style>
    /* ===== טוקנים (Apple HIG, iOS קלאסי). צבעים קשיחים רק בבלוקים האלה ===== */
    :root {
      --bg: #F2F2F7; --bg2: #FFFFFF; --bg3: #F2F2F7; --bar: rgb(249,249,249);
      --label: #000000; --label2: rgba(60,60,67,.76); --label3: rgba(60,60,67,.3); --sep: rgba(60,60,67,.29);
      --fill: rgba(120,120,128,.2); --fill2: rgba(118,118,128,.12);
      --blue: rgb(0,136,255); --red: rgb(255,56,60); --green: rgb(52,199,89); --orange: rgb(255,141,40); --yellow: rgb(255,204,0);
      --purple: rgb(203,48,224); --teal: rgb(0,195,208); --pink: rgb(255,45,85); --indigo: rgb(97,85,245); --mint: rgb(0,200,179);
      --brown: rgb(172,127,94); --gray: rgb(142,142,147); --gray3: rgb(199,199,204); --gray5: rgb(229,229,234);
      --white: #FFFFFF;
      --pie-pink: rgb(234,62,132);   /* ורוד לעוגה (~337°): ה-pink של iOS קרוב מדי לאדום, ורוד כחלחל קרוב מדי לסגול */
      --tab-on: rgba(0,136,255,.14); --tab-on-text: #0056B3;   /* טאב פעיל: רקע pill, טקסט+אייקון (כהה מ-tint כדי לעבור 4.5:1) */
      /* Liquid Glass, Regular variant (WWDC25 219: "works in any size, over any content"). שכבת ניווט בלבד */
      --glass-bg: rgba(255,255,255,.55);
      --glass-shadow: inset 0 1px 0 rgba(255,255,255,.65), inset 0 -1px 0 rgba(0,0,0,.05), 0 0 0 .5px rgba(0,0,0,.08), 0 10px 30px rgba(0,0,0,.14);
      --glass-drop: 0 10px 30px rgba(0,0,0,.14);
      --glass-solid: var(--bg2);   /* בלי שקיפות: משטח אטום */
      --pill-spec: inset 0 1px 0 rgba(255,255,255,.35);
      /* עוגה: הטבעת על רקע הדף. נבחרת "חלבית" = הצבע ב-.38 מעל --bg2 */
      --pie-edge: rgba(255,255,255,.5); --pie-edge-sel: rgba(255,255,255,.8);
      --pie-milk: .38; --pie-milk-bg: var(--bg2); --pie-shadow: drop-shadow(0 8px 20px rgba(0,0,0,.10));
      --g-edge: rgba(0,0,0,.09); --g-shadow: 0 0 7px rgba(0,0,0,.04);   /* עטיפת כפתור Google */
      --tint: var(--blue); --danger: var(--red); --success: var(--green); --warn: var(--orange);
      --link-text: #0A66C2;
      /* טקסט צבעוני נגיש (נגזר; ניגודיות 4.5:1 על לבן ועל רקע תג/הודעה) */
      --danger-text: rgb(200,0,20); --warn-text: rgb(160,68,0); --success-text: rgb(0,112,30); --gray-text: rgba(60,60,67,.85);
      --tint-bg: rgba(0,136,255,.15); --side-on: rgba(0,136,255,.12);
      --shadow-seg: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); --seg-on: #FFFFFF; --seg-on-sub: var(--label2);   /* שורה שנייה בכפתור נבחר */
      --shadow-toast: 0 8px 24px rgba(0,0,0,.18);
      --scrim: rgba(0,0,0,.4);
      --knob-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16);
    }
    :root { color-scheme: light dark; }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    /* כהה: לפי המכשיר (אלא אם נבחר בהיר), או כשנבחר כהה. אותם ערכים בשני הבלוקים. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000; --bg2: #1C1C1E; --bg3: #2C2C2E; --bar: rgb(29,29,31);
        --label: #FFFFFF; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3); --sep: rgba(84,84,88,.6);
        --fill: rgba(120,120,128,.36); --fill2: rgba(118,118,128,.24);
        --blue: rgb(0,145,255); --red: rgb(255,66,69); --green: rgb(48,209,88); --orange: rgb(255,146,48); --yellow: rgb(255,214,0);
        --purple: rgb(219,52,242); --teal: rgb(0,210,224); --pink: rgb(255,55,95); --indigo: rgb(109,124,255); --mint: rgb(0,218,195);
        --brown: rgb(183,138,102); --gray3: rgb(72,72,74); --gray5: rgb(44,44,46);
        --link-text: var(--blue);
        --danger-text: rgb(255,105,97); --warn-text: var(--orange); --success-text: var(--green); --gray-text: rgba(235,235,245,.7);
        --tint-bg: rgba(0,136,255,.25); --side-on: rgba(0,136,255,.12); --seg-on: rgb(99,99,102); --seg-on-sub: var(--label);
        --pie-pink: rgb(255,88,150);
        --tab-on: rgba(0,145,255,.2); --tab-on-text: rgb(120,190,255);
        --glass-bg: rgba(30,30,32,.55); --glass-solid: var(--bg3); --glass-drop: 0 10px 30px rgba(0,0,0,.5);
        --glass-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.5);
        --pie-edge: rgba(255,255,255,.28); --pie-edge-sel: rgba(255,255,255,.5); --pie-milk: .45; --pie-milk-bg: var(--bg); --pie-shadow: none;
      }
    }
    :root[data-theme="dark"] {
      --bg: #000000; --bg2: #1C1C1E; --bg3: #2C2C2E; --bar: rgb(29,29,31);
      --label: #FFFFFF; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3); --sep: rgba(84,84,88,.6);
      --fill: rgba(120,120,128,.36); --fill2: rgba(118,118,128,.24);
      --blue: rgb(0,145,255); --red: rgb(255,66,69); --green: rgb(48,209,88); --orange: rgb(255,146,48); --yellow: rgb(255,214,0);
      --purple: rgb(219,52,242); --teal: rgb(0,210,224); --pink: rgb(255,55,95); --indigo: rgb(109,124,255); --mint: rgb(0,218,195);
      --brown: rgb(183,138,102); --gray3: rgb(72,72,74); --gray5: rgb(44,44,46);
      --link-text: var(--blue);
      --danger-text: rgb(255,105,97); --warn-text: var(--orange); --success-text: var(--green); --gray-text: rgba(235,235,245,.7);
      --tint-bg: rgba(0,136,255,.25); --side-on: rgba(0,136,255,.12); --seg-on: rgb(99,99,102); --seg-on-sub: var(--label);
      --pie-pink: rgb(255,88,150);
      --tab-on: rgba(0,145,255,.2); --tab-on-text: rgb(120,190,255);
      --glass-bg: rgba(30,30,32,.55); --glass-solid: var(--bg3); --glass-drop: 0 10px 30px rgba(0,0,0,.5);
        --glass-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(0,0,0,.35), 0 0 0 .5px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.5);
        --pie-edge: rgba(255,255,255,.28); --pie-edge-sel: rgba(255,255,255,.5); --pie-milk: .45; --pie-milk-bg: var(--bg); --pie-shadow: none;
    }
    @media (prefers-contrast: more) {
      :root { --label2: rgba(60,60,67,.85); --sep: rgba(60,60,67,.5); }
      :root[data-theme="dark"] { --label2: rgba(235,235,245,.85); --sep: rgba(84,84,88,.9); }
    }
    @media (prefers-contrast: more) and (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --label2: rgba(235,235,245,.85); --sep: rgba(84,84,88,.9); }
    }
    /* ===== סוף טוקנים ===== */

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    html, body, button, a, input, select, label { touch-action: manipulation; }   /* בלי זום בלחיצה כפולה */
    body {
      margin: 0; background: var(--bg); color: var(--label);
      font-family: system-ui, -apple-system, "SF Hebrew", "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; font-size: 1.0625rem; line-height: 1.375rem; font-weight: 400;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    h1, h2, h3, p { margin: 0; font-weight: inherit; font-size: inherit; }

    /* טיפוגרפיה (rem: 16px = 1rem, כדי שהגדלת טקסט ל-200% תעבוד) */
    .t-large  { font-size: 2.125rem;  line-height: 2.5625rem; font-weight: 700; }
    .t-title1 { font-size: 1.75rem;   line-height: 2.125rem;  font-weight: 700; }
    .t-title2 { font-size: 1.375rem;  line-height: 1.75rem;   font-weight: 700; }
    .t-title3 { font-size: 1.25rem;   line-height: 1.5625rem; font-weight: 600; }
    .t-head   { font-size: 1.0625rem; line-height: 1.375rem;  font-weight: 600; }
    .t-body   { font-size: 1.0625rem; line-height: 1.375rem;  font-weight: 400; }
    .t-sub    { font-size: .9375rem;  line-height: 1.25rem;   font-weight: 400; }
    .t-foot   { font-size: .8125rem;  line-height: 1.125rem;  font-weight: 400; }
    .t-cap1   { font-size: .75rem;    line-height: 1rem;      font-weight: 400; }
    .t-cap2   { font-size: .6875rem;  line-height: .8125rem;  font-weight: 500; }
    .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
    .ltr { direction: ltr; text-align: left; }
    .nw { white-space: nowrap; }
    .em { direction: ltr; text-align: end; unicode-bidi: isolate; }
    .sec { color: var(--label2); }
    .danger { color: var(--danger-text); }
    .warn { color: var(--warn-text); }
    .ok { color: var(--success-text); }
    .hidden { display: none !important; }
    .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ===== מבנה: בלי סרגל עליון. כפתורים צפים (חזרה / פעולה), כותרת גדולה, tab bar / sidebar ===== */
    /* כפתור צף: עיגול בפינה העליונה. פעולה (+ / …) בצד inline-end, חזרה בצד inline-start. נשאר במקום בגלילה. */
    .fab { position: fixed; z-index: 8; top: calc(16px + env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0;
      display: flex; align-items: center; justify-content: center; color: var(--label); cursor: pointer; }
    .fab .i { width: 22px; height: 22px; position: relative; }
    #fab-end { inset-inline-end: 16px; }
    #fab-back { inset-inline-start: 16px; }
    .fab:active { transform: scale(.94); }
    .fab:hover::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--fill2); pointer-events: none; }
    /* ===== Liquid Glass (Regular): רק שכבת הניווט — tab bar, כפתורים צפים, סרגל הצד בדסקטופ. לא כרטיסים, רשימות, sheets או שדות ===== */
    .glass { background: var(--glass-bg); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%); box-shadow: var(--glass-shadow); }
    /* בלי שקיפות: הגדרת נגישות, ניגודיות מוגברת, או דפדפן בלי backdrop-filter → משטח אטום עם מסגרת */
    @media (prefers-reduced-transparency: reduce) {
      .glass { background: var(--glass-solid); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: inset 0 0 0 1px var(--sep), var(--glass-drop); }
    }
    @media (prefers-contrast: more) {
      .glass { background: var(--glass-solid); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: inset 0 0 0 1px var(--sep), var(--glass-drop); }
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass { background: var(--glass-solid); box-shadow: inset 0 0 0 1px var(--sep), var(--glass-drop); }
    }
    /* scroll edge: אחרי גלילה, פס עליון מהרקע לשקוף מתחת לכפתורים הצפים */
    #edge { position: fixed; z-index: 7; top: 0; inset-inline: 0; height: calc(80px + env(safe-area-inset-top)); pointer-events: none; opacity: 0;
      background: linear-gradient(180deg, var(--bg) 0, var(--bg) 35%, transparent); transition: opacity 150ms cubic-bezier(.2,.8,.2,1); }
    #edge.on { opacity: 1; }
    @media (prefers-reduced-transparency: reduce) { #edge { background: var(--bg); height: calc(72px + env(safe-area-inset-top)); } }
    /* "מתעדכן…": בשורה של הכפתורים, בין שניהם; נגלל עם הדף */
    #sync { position: absolute; z-index: 1; top: calc(16px + env(safe-area-inset-top)); inset-inline: 72px; height: 48px; display: flex; align-items: center; justify-content: center;
      white-space: nowrap; overflow: hidden; pointer-events: none; }
    /* התוכן מתחיל 16 מתחת לכפתור הצף (16 + 44 + 16), בטלפון ובדסקטופ */
    main { padding: calc(16px + 44px + 16px + env(safe-area-inset-top)) 16px calc(64px + 12px + 16px + env(safe-area-inset-bottom)); }
    .ltitle { padding: 8px 0 8px; }
    body:has(#nav.hidden) main { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }

    /* tab bar (טלפון ובינוני): קפסולת זכוכית צפה, 5 טאבים ברוחב שווה, אייקונים בלבד (aria-label + title).
       פעיל: pill אחד שזז בין הטאבים (translateX, 250ms) + אייקון בצבע הדגשה עם מילוי 20% (ל-Lucide אין גרסה ממולאת). */
    nav#nav {
      position: fixed; z-index: 8; inset-inline: 0; margin-inline: auto; width: calc(100% - 32px); max-width: 420px;
      bottom: calc(12px + env(safe-area-inset-bottom)); height: 64px; border-radius: 32px; display: flex; align-items: center; padding: 0 3px;
    }
    nav#nav button { position: relative; z-index: 1; flex: 1 1 0; min-width: 0; height: 64px; border: 0; background: none; color: var(--label); padding: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; }
    nav .tp { display: flex; align-items: center; justify-content: center; }
    nav .tl { display: none; }
    nav .ic { display: inline-flex; }
    nav .ic .i { width: 26px; height: 26px; transition: color 250ms ease-out, fill-opacity 250ms ease-out; fill: currentColor; fill-opacity: 0; }
    nav#nav button.on { color: var(--tab-on-text); }
    nav#nav button.on .ic .i { fill-opacity: .2; }
    nav#nav button:active .ic .i { opacity: .6; }
    .pill { position: absolute; z-index: 0; inset: 0 auto auto 0; width: 0; height: 52px; border-radius: 26px; background: var(--tab-on); box-shadow: var(--pill-spec);
      pointer-events: none; opacity: 0; transition: transform 250ms ease-out, width 250ms ease-out, height 250ms ease-out; }
    .dot { position: absolute; top: 10px; inset-inline-start: calc(50% + 4px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; box-shadow: 0 0 0 2px var(--glass-solid);
      background: var(--red); color: var(--white); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
    .sb-head, .sb-prof, .sb-only { display: none !important; }

    /* בינוני: עמודת תוכן עד 640 */
    @media (min-width: 600px) and (max-width: 1023px) {
      nav#nav { max-width: 440px; margin-inline: auto; }
      #fab-end { inset-inline-end: max(16px, calc((100vw - 640px) / 2 + 16px)); }
      #fab-back { inset-inline-start: max(16px, calc((100vw - 640px) / 2 + 16px)); }
    }
    @media (min-width: 600px) {
      main { max-width: 640px; margin-inline: auto; }
    }
    /* רחב: sidebar */
    @media (min-width: 1024px) {
      body:has(#nav:not(.hidden)) { display: grid; grid-template-columns: 272px minmax(0, 1fr); }
      body:has(#nav:not(.hidden)) #nav { grid-column: 1; grid-row: 1; }
      body:has(#nav:not(.hidden)) main { grid-column: 2; grid-row: 1; }
      /* כפתורים צפים בתוך עמודת התוכן (760, באמצע השטח שליד הסרגל הצדי) */
      /* כפתורים צפים בתוך עמודת התוכן (760, באמצע השטח שליד הפאנל: 240 + 16 מכל צד) */
      body:has(#nav:not(.hidden)) #fab-end { inset-inline-end: max(24px, calc((100vw - 1032px) / 2 + 24px)); }
      body:has(#nav:not(.hidden)) #fab-back { inset-inline-start: calc(272px + max(24px, calc((100vw - 1032px) / 2 + 24px))); }
      body:has(#nav:not(.hidden)) #sync { inset-inline-start: calc(272px + 72px); }
      body:has(#nav:not(.hidden)) #edge { inset-inline-start: 272px; }
      /* סרגל צד = פאנל זכוכית צף (אותה שפה כמו בטלפון), עם טקסט */
      nav#nav { position: sticky; top: 16px; bottom: auto; inset-inline: auto; margin: 16px; width: 240px; max-width: none; height: calc(100vh - 32px); border-radius: 24px;
        align-items: stretch; flex-direction: column; gap: 2px; padding: 0 8px 8px; }
      nav#nav button { flex: none; height: 44px; justify-content: flex-start; padding: 0 12px; border-radius: 22px; }
      nav .tp { gap: 12px; }
      nav .tl { display: inline; font-size: 1.0625rem; line-height: 1.375rem; font-weight: 400; }
      nav .ic .i { width: 22px; height: 22px; }
      nav#nav button:not(.on):hover { background: var(--fill2); }
      .sb-head { display: block !important; padding: 16px 12px; }
      .sb-prof { display: flex !important; margin-top: auto; }
      .sb-only { display: flex !important; }
      nav#nav .sb-prof { height: auto; min-height: 44px; }
      .sb-prof .tl { overflow: hidden; text-overflow: ellipsis; color: var(--label2); }
      .dot { top: 4px; inset-inline-start: 26px; }
      main { max-width: 760px; width: 100%; margin-inline: auto; padding: calc(16px + 44px + 16px + env(safe-area-inset-top)) 24px 48px; }
    }

    /* ===== קבוצות (inset grouped) ===== */
    .grp { margin-top: 32px; }
    .grp:first-child, .ltitle + .grp, .seg + .grp, .tiles + .grp { margin-top: 24px; }
    .search + .grp { margin-top: 16px; }
    details.grp + details.grp { margin-top: 12px; }
    .gh { color: var(--label2); padding: 0 16px 7px; }
    .gf { color: var(--label2); padding: 7px 16px 0; }
    .gbody { background: var(--bg2); border-radius: 10px; overflow: hidden; }
    .gbody.pad, .pad { padding: 12px 16px; }
    .row {
      position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-height: 44px; padding: 11px 16px;
      width: 100%; border: 0; background: none; text-align: start; color: var(--label);
    }
    details { position: relative; }
    details.grp + details.grp::before { content: none; }
    .row + .row::before, .row + details::before, details + .row::before, details + details::before {
      content: ''; position: absolute; top: 0; inset-inline-start: 16px; inset-inline-end: 0; border-top: .5px solid var(--sep);
    }
    .row.swr + .row::before, .row + .row.swr::before { inset-inline-start: 16px; }
    .row.click, button.row { cursor: pointer; transition: background-color 150ms cubic-bezier(.2,.8,.2,1); }
    .row.click:active, button.row:active { background: var(--fill2); }
    .row .main { flex: 1 1 8rem; min-width: 0; }
    .row .main > * { overflow: hidden; text-overflow: ellipsis; }
    .row .val { text-align: end; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .row .ico { width: 28px; height: 28px; border-radius: 7px; background: var(--tint); color: var(--white); display: inline-flex; align-items: center; justify-content: center; flex: none; }
    .row .ico svg { width: 18px; height: 18px; }
    .row.red .ico { background: var(--danger); }
    .row.row-c { justify-content: center; }
    .row.danger, .row .danger { color: var(--danger-text); }
    /* אייקון Lucide: קו 1.75 (קרוב ל-SF Regular), גריד 24 */
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .chev { width: 18px; height: 18px; color: var(--label3); stroke-width: 2.25; }
    .row .chev { order: 9; }
    .row.open > .chev { transform: rotate(-90deg); }

    @media (max-width: 1023.98px) {

    /* תפריט מהסרגל */

    .row.tr2 { min-height: 44px; padding-block: 0; cursor: pointer; flex-wrap: nowrap; }
    .tsub.v > .row { padding-inline-start: 32px; min-height: 44px; padding-block: 0; }

    .ck[aria-checked="true"] .ckc, .ck[aria-checked="mixed"] .ckc { background: var(--tint); border-color: var(--tint); }

    /* הסיכום והכפתור קבועים למטה גם בטלפון (בדסקטופ: מחוץ לגלילה) */

    .msg.w { background: color-mix(in srgb, var(--orange) 12%, transparent); } .msg.w::before { content: '!'; background: var(--warn); }

  /**

  function formHtml(fields) {

        grp('תצוגה', themeRow()) +
        grp('תחזוקה',
          iconRow(ic('refresh'), 'רענון עכשיו', '', { id: 'b-refresh' }) +
          iconRow(ic('x'), 'ביטול הפעולה האחרונה', 'undoLast()', { cls: 'danger red' }),
          'רענון קורא את טבלאות התוכן. עד דקה.') +
        (DEBUG ? grp('ביצועים', '<div id="perf">' + perfRows() + '</div>') : '') +
        logoutGroup() +
        '<p class="foot-link t-foot"><a href="https://cashflow.brandemedia.co.il/privacy.html" target="_blank" rel="noopener">מדיניות פרטיות</a></p>');
      $('b-refresh').onclick = function () {
        var b = $('b-refresh'), t = b.querySelector('.main'); b.disabled = true; t.textContent = 'קורא טבלאות…';
        call('refreshNow', [getToken()], function (r) {
          b.disabled = false; t.textContent = 'רענון עכשיו'; S.home = null;
          openModal(sheetHtml('רענון', linesHtml(r.ok ? r.summary : [r.message], r.ok ? 'o' : 'e'), '', 'סגור'));
        }, function (m) { b.disabled = false; t.textContent = 'רענון עכשיו'; toastErr(m); });
      };
    }, { onRefresh: function () { if ($('perf')) $('perf').innerHTML = perfRows(); } });
  }
  function undoLast() { runAct({ title: 'ביטול הפעולה האחרונה', fn: 'actionUndoLast', args: function (cf) { return [getToken(), cf]; } }); }

  /** שותפים: רווח החודש + לכל שותף. רשימה אחת של חודשים (→ גיליון לחודש). שורת סיכום מצטבר. */
  function partnersView() {
    loadHome(function (h) {
      var cur = h.partners.filter(function (p) { return p.month === h.month; })[0];
      var first = h.partners.map(function (p) { return p.month; }).filter(function (m) { return /^\d{4}-\d{2}$/.test(m); }).sort()[0];
      setMain(
        hero('רווח ' + monthName(h.month), money(cur ? cur.profit : 0), cur ? splitLine(cur) : '') +
        missMsg(h.totalPnl.missing, 'בלי מחיר או עלות', 'הסכומים חלקיים') +
        grp('לפי חודש', h.partners.map(function (p) {
          return '<button class="row" onclick="monthSheet(' + esc(JSON.stringify(p.month)) + ')"><span class="main t-body">' + monthName(p.month, true) + '</span>' +
            wg(p.missing, 'בלי מחיר או עלות') + '<span class="t-body num">' + money(p.profit) + '</span>' + CHEV + '</button>';
        }).join('') || emptyRow()) +
        grp('', '<div class="row"><div class="main"><div class="t-head">רווח מצטבר' + (first ? ' · מ' + monthName(first, true) : '') + '</div><div class="t-foot sec"><span class="nw">הכנסות ' + money(h.totalPnl.revenue) + '</span> · <span class="nw">עלויות ' + money(h.totalPnl.cost) + '</span></div></div>' +
          '<span class="t-head num">' + money(h.totalPnl.profit) + '</span></div>')
      );
    });
  }
  /** "לכל שותף ₪X" כשהאחוזים שווים; אחרת כל שותף בנפרד. */
  function splitLine(p) {
    if (p.error || !p.partners.length) return esc(p.error || '');
    var eq = p.partners.every(function (x) { return x.pct === p.partners[0].pct; });
    return eq ? 'לכל שותף ' + money(p.partners[0].amount) : p.partners.map(function (x) { return '<span class="nw">' + esc(x.email) + ' ' + money(x.amount) + '</span>'; }).join(' · ');
  }
  function monthSheet(m) {
    var p = S.home.partners.filter(function (x) { return x.month === m; })[0]; if (!p) return;
    var row = function (k, v, cls) { return '<div class="row"><div class="main t-body">' + k + '</div><span class="' + (cls || 't-body') + ' num">' + money(v) + '</span></div>'; };
    openModal(sheetHtml(monthName(m, true), grp('', row('הכנסות', p.revenue) + row('עלויות', p.cost) + row('רווח', p.profit, 't-head')) +
      missMsg(p.missing, 'בלי מחיר או עלות', '', true) + grp('חלוקת שותפים', partnerRows(p)), '', 'סגור'));
  }

  // ---------- 6.5 דף עורך אישי ----------
  function myPage() {
    S.screen = { t: 'שלום', large: 1 };
    var snapPage = S.mySnap; S.mySnap = null;
    if (snapPage) { S.renderSrc = 'snapshot'; renderMy(snapPage); setSync(true); }
    else setMain(skeleton('my'));
    call('getMyPage', [getToken()], function (r) {
      S.snapAt = null; setSync(false);
      if (!r.ok && S.boot) { S.boot = false; setRole(null); return bootSlow(); }   // התפקיד השמור כבר לא נכון
      if (!r.ok) return setMain('<div class="msg e">' + esc(r.message) + '</div>' + logoutGroup());
      saveSnap('editor', { page: r.page });
      if (snapPage && JSON.stringify(snapPage) === JSON.stringify(r.page)) return;   // לא השתנה
      S.renderSrc = 'שרת';
      var y = snapPage ? window.scrollY : 0;
      renderMy(r.page);
      if (snapPage) window.scrollTo(0, y);
    }, function (m) { setSync(false); toastErr(m, myPage); });
  }
  /**
   * דף העורך, לפי הסדר: מגיע לך · שורת אזהרה אחת · מה עוד לא שולם (לפי לקוח) · הכסף שלי לפי לקוח (עוגה + בורר) ·
   * היסטוריית תשלומים · מראה · התנתקות. רק מה שהשרת החזיר ל-getMyPage.
   */
  function renderMy(p) {
    var items = p.videos.map(function (v) { return { kind: 'v', client: v.client, type: v.type || 'בלי סוג', num: v.num, date: '', amount: v.amount }; })
      .concat(p.projects.map(function (x) { return { kind: 'p', client: x.client, pname: x.name, amount: x.amount }; }));
    var E = p.earnings, X = E.periods[S.period], colors = {};
    // צבע קבוע ללקוח בכל התקופות: לפי הסדר הא״ב של כל הלקוחות שלו
    var keys = {}; Object.keys(E.periods).forEach(function (k) { E.periods[k].slices.forEach(function (x) { keys[x.key] = 1; }); });
    Object.keys(keys).sort().forEach(function (k, i) { colors[k] = i; });
    S.screen = { t: 'שלום ' + p.name, large: 1 };
    setMain(
      hero('מגיע לך עכשיו', money(p.due.amount), nOf(p.due.count, 'פריט', 'פריטים') + ' מאז התשלום האחרון') +
      (p.due.missing ? '<div class="msg w t-sub">' + nOf(p.due.missing, 'פריט', 'פריטים') + ' עוד בלי מחיר. הסכום יתעדכן כשיוסף ישלים.</div>' : '') +
      openList(items) +
      pieGrp('הכסף שלי לפי לקוח · ' + esc(periodShort(E.labels)),
        periodSeg(E.labels, function () { renderMy(p); }) + '<div class="pie-gap"></div>' +
        pieBlock({ slices: X.slices, deductions: [], total: X.amount }, colors, 'הכסף שלי לפי לקוח, ' + periodName(E.labels)) +
        (X.pending.length ? '<p class="calc t-foot sec">עוד בלי מחיר (לא בעוגה): ' + X.pending.map(function (x) { return '<span class="nw">' + esc(x.key) + ' · ' + counts(x) + '</span>'; }).join(', ') + '</p>' : ''),
        'כולל מה שכבר שולם') +
      sect('היסטוריית תשלומים', p.payments.map(function (x) {
        return '<div class="row"><div class="main"><div class="t-body">' + date(x.date) + ' · ' + nOf(x.count, 'פריט', 'פריטים') + '</div><div class="t-foot">' +
          (x.hasInvoice ? '<span class="ok">חשבונית ✓</span>' : '<span class="warn">⚠︎ אין חשבונית</span>') + '</div>' +
          (x.hasInvoice ? '' : '<button class="btn-plain t-sub inl ia" onclick="myInvoice(' + esc(JSON.stringify(x.id)) + ')">' + ic('doc') + 'העלאת חשבונית</button>') + '</div>' + paidVal(x.amount, x.bonus) + '</div>';
      }).join(''), true) +
      grp('תצוגה', themeRow()) +
      logoutGroup()
    );
    markPaint();
  }
  function myInvoice(paymentId) {
    var fields = [{ k: 'file', label: 'קובץ חשבונית (PDF / תמונה)', type: 'file' }];
    openForm('העלאת חשבונית', fields, function (v, files) {
      if (!files.file) return formErr('לבחור קובץ');
      readFile(files.file, function (f) {
        runAct({ title: 'העלאת חשבונית', fn: 'editorUploadInvoice', args: function (cf) { return [getToken(), paymentId, f, cf]; }, after: myPage });
      });
    });
  }

  // ---------- התחלה ----------
  /** בלי תפקיד שמור: getCurrentUser ואז המסך (כמו קודם). */
  function bootSlow() {
    var t = getToken();
    if (!t) return loginView();
    call('getCurrentUser', [t], function (r) {
      if (r.ok) return start(r.user);
      setToken(null); loginView();
    }, function () { setToken(null); loginView(); });
  }
  (function init() {
    var t = getToken(), role = getRole();
    if (!t) return loginView();
    // תפקיד שמור → בקשה אחת. השרת מאמת את הטוקן בכל מקרה (AUTH_REQUIRED → כניסה, FORBIDDEN → bootSlow).
    var snap = role ? readSnap() : null;
    if (snap && snap.role !== role) snap = null;
    if (role === 'admin') {
      S.boot = true; $('nav').classList.remove('hidden'); setTimeout(movePill);
      if (snap && snap.data && snap.data.home) {   // ציור מיידי מה-snapshot; go('home') מרענן ברקע
        S.home = snap.data.home; S.lists = snap.data.lists; S.homeAt = Date.now(); S.fromSnap = true; S.snapAt = snap.at;
        if (snap.data.user) applyUser(snap.data.user);
        var dot = $('alert-dot'); dot.textContent = S.home.alertsOpen; dot.classList.toggle('hidden', !S.home.alertsOpen);
      }
      return go('home');
    }
    if (role === 'editor') {
      S.boot = true;
      if (snap && snap.data && snap.data.page) { S.mySnap = snap.data.page; S.snapAt = snap.at; }
      return myPage();
    }
    bootSlow();
  })();
</script>
</body>
</html>
