<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brande CashFlow</title>
  <style>
    :root { --bg: #f4f5f7; --card: #fff; --txt: #1f2328; --mute: #6b7280; --line: #e5e7eb; --pri: #1a73e8; --ok: #137333; --warn: #b06000; --err: #c5221f; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; margin: 0; background: var(--bg); color: var(--txt); font-size: 16px; }
    header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
    header h1 { font-size: 17px; margin: 0; flex: 1; }
    header .who { font-size: 12px; color: var(--mute); }
    main { max-width: 640px; margin: 0 auto; padding: 12px 16px 96px; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; z-index: 5; }
    nav button { flex: 1; border: 0; background: none; padding: 10px 0 14px; font-size: 13px; color: var(--mute); position: relative; }
    nav button.on { color: var(--pri); font-weight: bold; }
    nav .dot { position: absolute; top: 4px; margin-right: 4px; background: var(--err); color: #fff; border-radius: 9px; font-size: 11px; padding: 0 5px; }
    .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .card h2 { font-size: 16px; margin: 0 0 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .stat { background: var(--card); border-radius: 12px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .stat .k { font-size: 12px; color: var(--mute); }
    .stat .v { font-size: 20px; font-weight: bold; margin-top: 4px; direction: ltr; text-align: right; }
    .stat.click { cursor: pointer; }
    .big { font-size: 34px; font-weight: bold; direction: ltr; text-align: right; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row.click { cursor: pointer; }
    .row .main { flex: 1; min-width: 0; }
    .row .sub { font-size: 12px; color: var(--mute); }
    .num { direction: ltr; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .muted { color: var(--mute); }
    .warn { color: var(--warn); }
    .err { color: var(--err); }
    .ok { color: var(--ok); }
    .tag { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: #eef2ff; color: #3730a3; white-space: nowrap; }
    .tag.g { background: #e6f4ea; color: var(--ok); } .tag.r { background: #fce8e6; color: var(--err); } .tag.y { background: #fef7e0; color: var(--warn); }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    button.b { font-size: 15px; padding: 10px 14px; border: 0; border-radius: 8px; background: var(--pri); color: #fff; }
    button.b.s { background: #e8eaed; color: var(--txt); }
    button.b.sm { font-size: 13px; padding: 6px 10px; }
    button.b.full { width: 100%; margin-top: 10px; }
    button:disabled { opacity: .5; }
    details { margin-bottom: 12px; background: var(--card); border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    details summary { padding: 14px; font-weight: bold; cursor: pointer; }
    details .in { padding: 0 14px 10px; }
    label { display: block; font-size: 13px; color: var(--mute); margin: 10px 0 4px; }
    input, select, textarea { width: 100%; font-size: 16px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; background: #fff; font-family: inherit; }
    input[type=checkbox] { width: auto; transform: scale(1.3); margin-left: 8px; }
    .chk { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .chk span { flex: 1; }
    .ltr { direction: ltr; text-align: left; }
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
    #modal .sheet { background: var(--card); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px 16px 28px; }
    #modal h2 { margin: 0 0 8px; font-size: 18px; }
    .msg { padding: 10px; border-radius: 8px; margin: 8px 0; font-size: 14px; }
    .msg.e { background: #fce8e6; color: var(--err); } .msg.w { background: #fef7e0; color: var(--warn); } .msg.o { background: #e6f4ea; color: var(--ok); }
    ul.lines { padding-right: 18px; margin: 6px 0; } ul.lines li { margin-bottom: 4px; }
    .hidden { display: none !important; }
    #toast { position: fixed; bottom: 80px; left: 16px; right: 16px; max-width: 600px; margin: auto; background: #323232; color: #fff; padding: 12px; border-radius: 8px; z-index: 20; }
    .center { text-align: center; padding: 40px 0; color: var(--mute); }
    a { color: var(--pri); }

    /* טעינה: skeleton בגובה קבוע — בלי קפיצות */
    .sk { background: linear-gradient(90deg, #eceef1 25%, #f6f7f9 37%, #eceef1 63%); background-size: 400% 100%; animation: sk 1.3s ease infinite; border-radius: 8px; }
    @keyframes sk { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    .sk.l { height: 14px; margin: 10px 0; } .sk.l.s { width: 40%; } .sk.l.m { width: 70%; }
    .sk.v { height: 24px; width: 60%; margin-top: 8px; } .sk.c { height: 180px; width: 180px; border-radius: 50%; margin: 8px auto; }
    @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
    .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .7s linear infinite; vertical-align: -3px; }
    @keyframes rot { to { transform: rotate(360deg); } }

    /* בורר תקופה */
    .seg { display: flex; background: #e8eaed; border-radius: 10px; padding: 3px; margin-bottom: 12px; gap: 2px; }
    .seg button { flex: 1; border: 0; background: none; padding: 8px 4px; border-radius: 8px; font-size: 14px; color: var(--txt); font-family: inherit; cursor: pointer; }
    .seg button.on { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: bold; }

    /* עוגה */
    .pie { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
    .pie svg { width: 180px; height: 180px; flex: none; margin: 0 auto; }
    .pie svg path { stroke: var(--card); stroke-width: 2; }
    .pie svg path:hover { opacity: .85; }
    .legend { flex: 1; min-width: 220px; }
    .legend .row { padding: 7px 0; }
    .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-left: 6px; vertical-align: 0; flex: none; }
    .pct { color: var(--mute); font-size: 12px; min-width: 44px; text-align: left; direction: ltr; }
    .ded .row { padding: 6px 0; font-size: 14px; }
    .total { font-size: 26px; font-weight: bold; direction: ltr; text-align: right; }
    .ed-pie { padding: 4px 0 10px; }
    .cols { display: grid; grid-template-columns: 1fr; gap: 0 12px; }

    /* דסקטופ: תוכן ממורכז עד 1100px, ניווט עליון, גרידים */
    @media (min-width: 900px) {
      header { padding: 12px 24px; }
      header h1 { font-size: 19px; }
      main { max-width: 1100px; padding: 20px 24px 40px; }
      header { position: static; }
      nav { position: sticky; top: 0; bottom: auto; justify-content: center; border-top: 0; border-bottom: 1px solid var(--line); }
      nav button { flex: none; padding: 12px 22px; font-size: 15px; }
      nav button.on::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; background: var(--pri); }
      .grid { grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
      .stat { padding: 16px; } .stat .v { font-size: 24px; }
      .card { padding: 18px 20px; margin-bottom: 16px; } .card h2 { font-size: 17px; }
      .cols { grid-template-columns: 1fr 1fr; gap: 0 16px; align-items: start; }
      .cols.three { grid-template-columns: 1fr 1fr 1fr; }
      .seg { max-width: 460px; }
      .big { font-size: 40px; }
      #modal { align-items: center; }
      #modal .sheet { border-radius: 16px; }
      #toast { bottom: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Brande CashFlow</h1>
    <span class="who" id="who"></span>
    <button class="b s sm hidden" id="b-logout">יציאה</button>
  </header>
  <nav id="nav" class="hidden">
    <button data-v="home">בית</button>
    <button data-v="clients">לקוחות</button>
    <button data-v="editors">עורכים</button>
    <button data-v="alerts">התראות<span class="dot hidden" id="alert-dot"></span></button>
    <button data-v="more">עוד</button>
  </nav>
  <main id="main"><div class="card"><div class="sk l s"></div><div class="sk l m"></div><div class="sk l"></div></div></main>
  <div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="hidden"></div>

<script>
  // ---------- בסיס ----------
  var TOKEN_KEY = 'brande_token', memToken = null;
  var S = { user: null, home: null, lists: null, view: null, arg: null };

  // הטוקן: localStorage → sessionStorage → זיכרון. בתוך iframe (דף WordPress) הדפדפן יכול לחסום/לחלק אחסון לפי אתר;
  // אז הכניסה עדיין עובדת, רק צריך להתחבר שוב אחרי רענון.
  function store(kind) { try { var s = window[kind]; s.setItem('_t', '1'); s.removeItem('_t'); return s; } catch (e) { return null; } }
  var STORES = [store('localStorage'), store('sessionStorage')].filter(Boolean);
  function getToken() {
    for (var i = 0; i < STORES.length; i++) { try { var v = STORES[i].getItem(TOKEN_KEY); if (v) return v; } catch (e) {} }
    return memToken;
  }
  function setToken(t) {
    memToken = t;
    STORES.forEach(function (s) { try { t ? s.setItem(TOKEN_KEY, t) : s.removeItem(TOKEN_KEY); } catch (e) {} });
  }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return n === null || n === undefined ? '—' : '₪' + Number(n).toLocaleString('he-IL', { maximumFractionDigits: 2 }); }
  function partial(missing) { return missing ? ' <span class="tag y">חלקי: ' + missing + ' חסרים</span>' : ''; }
  function date(s) { if (!s) return '—'; var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? m[3] + '/' + m[2] + '/' + m[1] : esc(s); }
  function month(s) { var m = /^(\d{4})-(\d{2})$/.exec(s || ''); return m ? m[2] + '/' + m[1] : esc(s || 'ללא תאריך'); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.add('hidden'); }, 3500); }
  function setMain(html) { $('main').innerHTML = html; window.scrollTo(0, 0); }

  // בתוך Apps Script (doGet) → google.script.run. כדף סטטי (cashflow.brandemedia.co.il) → POST ל-doPost.
  var API_URL = 'https://script.google.com/macros/s/AKfycbyIid2Z0N_dfKbPgkCjmkKb2FnmgxxSi3PWzrk-WeqoL8iDoYOyqdOIFDCMLSIO8k22/exec';
  var GAS = typeof google !== 'undefined' && google.script && google.script.run;
  // OAuth Client ID לכניסה עם Google (ציבורי). ריק → אין כפתור Google. רק בדף הסטטי (בתוך Apps Script המקור לא מורשה).
  var GOOGLE_CLIENT_ID = '408183333823-cm0f4bqukgs13pdc8lg73uj3jttva4hr.apps.googleusercontent.com';

  /** קריאה לשרת. שגיאת הרשאה → חזרה למסך כניסה. */
  function call(fn, args, onOk, onErr) {
    var fail = function (m) {
      if (/AUTH_REQUIRED/.test(m)) { setToken(null); return loginView('החיבור פג. להיכנס שוב.'); }
      if (/FORBIDDEN/.test(m)) m = 'אין הרשאה';
      if (onErr) onErr(m); else toast('שגיאה: ' + m);
    };
    if (GAS) {
      var r = google.script.run.withSuccessHandler(onOk).withFailureHandler(function (e) { fail((e && e.message) || String(e)); });
      return r[fn].apply(r, args);
    }
    // text/plain → בלי preflight. credentials: omit → בלי עוגיות Google.
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow',
      body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (res) {
        if (!res.ok) throw new Error('שגיאת שרת (' + res.status + '). לנסות שוב.');
        return res.text().then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('תשובה לא תקינה מהשרת. לנסות שוב.'); } });
      }, function () { throw new Error('אין חיבור לשרת. לנסות שוב.'); })
      .then(function (d) { if (d && d.ok) onOk(d.result); else fail((d && d.error) || 'תשובה לא תקינה מהשרת'); })
      .catch(function (e) { fail((e && e.message) || 'אין חיבור לשרת'); });
  }

  // ---------- כניסה ----------
  function loginView(note) {
    $('nav').classList.add('hidden'); $('b-logout').classList.add('hidden'); $('who').textContent = '';
    setMain('<div class="card"><h2>כניסה</h2>' + (note ? '<div class="msg w">' + esc(note) + '</div>' : '') +
      '<label>מייל</label><input id="email" type="email" class="ltr" autocomplete="email" inputmode="email">' +
      '<button class="b full" id="b-send">שלח לי קוד</button>' +
      '<div id="code-box" class="hidden"><label>קוד מהמייל (6 ספרות)</label><input id="code" class="ltr" inputmode="numeric" autocomplete="one-time-code" maxlength="6">' +
      '<button class="b full" id="b-verify">כניסה</button></div>' +
      (GOOGLE_CLIENT_ID && !GAS ? '<div class="sub muted" style="text-align:center;margin:12px 0 8px">או</div><div id="g-btn" style="display:flex;justify-content:center"></div>' : '') +
      '<div id="login-msg"></div></div>' +
      '<div class="sub muted" style="text-align:center"><a href="https://cashflow.brandemedia.co.il/privacy.html" target="_blank" rel="noopener" style="color:inherit">מדיניות פרטיות</a></div>');
    var lm = function (t, cls) { $('login-msg').innerHTML = t ? '<div class="msg ' + cls + '">' + esc(t) + '</div>' : ''; };
    if ($('g-btn')) googleButton(function (cred) {
      lm('מתחבר...', 'o');
      call('loginWithGoogle', [cred], function (r) {
        if (!r.ok) return lm(r.message, 'e');
        setToken(r.token); start(r.user);
      }, function (m) { lm(m, 'e'); });
    }, function () { lm('כפתור Google לא נטען. אפשר להיכנס עם קוד במייל.', 'w'); });
    $('b-send').onclick = function () {
      var email = $('email').value.trim();
      if (!email) return lm('להזין מייל', 'e');
      $('b-send').disabled = true;
      call('requestLoginCode', [email], function (r) {
        $('b-send').disabled = false; lm(r.message, r.ok ? 'o' : 'e');
        if (r.ok) { $('code-box').classList.remove('hidden'); $('code').focus(); }
      }, function (m) { $('b-send').disabled = false; lm(m, 'e'); });
    };
    $('b-verify') && ($('b-verify').onclick = function () {
      $('b-verify').disabled = true;
      call('verifyLoginCode', [$('email').value.trim(), $('code').value.trim()], function (r) {
        $('b-verify').disabled = false;
        if (!r.ok) return lm(r.message, 'e');
        setToken(r.token); start(r.user);
      }, function (m) { $('b-verify').disabled = false; lm(m, 'e'); });
    });
  }

  /** טוען Google Identity Services פעם אחת ומציג כפתור ב-#g-btn. onCred(idToken). */
  function googleButton(onCred, onFail) {
    var render = function () {
      if (!$('g-btn')) return;
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: function (r) { if (r && r.credential) onCred(r.credential); } });
      google.accounts.id.renderButton($('g-btn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'he' });
    };
    if (window.google && google.accounts && google.accounts.id) return render();
    var sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
    sc.onload = render; sc.onerror = onFail;
    document.head.appendChild(sc);
  }

  $('b-logout').onclick = function () {
    call('logout', [getToken()], function () { setToken(null); loginView(); }, function () { setToken(null); loginView(); });
  };

  /** 6.1.2 ניתוב לפי תפקיד. */
  function start(user) {
    S.user = user;
    $('who').textContent = user.email;
    $('b-logout').classList.remove('hidden');
    if (user.role === 'admin') { $('nav').classList.remove('hidden'); go('home'); }
    else { $('nav').classList.add('hidden'); myPage(); }
  }

  // ---------- מודאל + זרימת תצוגה → אישור ----------
  function openModal(html) { $('sheet').innerHTML = html; $('modal').classList.remove('hidden'); $('sheet').scrollTop = 0; }
  function closeModal() { $('modal').classList.add('hidden'); $('sheet').innerHTML = ''; }
  $('modal').onclick = function (e) { if (e.target === $('modal')) closeModal(); };

  function linesHtml(lines, cls) {
    if (!lines || !lines.length) return '';
    return '<div class="msg ' + cls + '"><ul class="lines">' + lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul></div>';
  }

  /**
   * act = { title, fn, args(confirm) → מערך ארגומנטים, after() }
   * שלב 1: קריאה בלי confirm → תצוגה מקדימה. שלב 2: "אישור" → אותה קריאה עם confirm.
   */
  function runAct(act) {
    openModal('<h2>' + esc(act.title) + '</h2><div class="center">מכין תצוגה מקדימה…</div>');
    call(act.fn, act.args(undefined), function (r) {
      if (!r.ok) return openModal('<h2>' + esc(act.title) + '</h2>' + linesHtml([r.message], 'e') + '<button class="b s full" onclick="closeModal()">סגור</button>');
      openModal('<h2>' + esc(act.title) + ' — לבדוק ולאשר</h2>' + linesHtml(r.preview, 'o') + linesHtml(r.warnings, 'w') +
        '<button class="b full" id="b-confirm">אישור וביצוע</button><button class="b s full" onclick="closeModal()">ביטול</button>');
      $('b-confirm').onclick = function () {
        $('b-confirm').disabled = true; $('b-confirm').textContent = 'מבצע…';
        call(act.fn, act.args(r.confirm), function (d) {
          if (!d.ok) return openModal('<h2>' + esc(act.title) + '</h2>' + linesHtml([d.message], 'e') + '<button class="b s full" onclick="closeModal()">סגור</button>');
          openModal('<h2>בוצע ✓</h2>' + linesHtml(d.done, 'o') + linesHtml(d.warnings, 'w') + '<div class="sub muted">מזהה: ' + esc(d.id) + '</div>' +
            '<button class="b full" id="b-done">סגור</button>');
          $('b-done').onclick = function () { closeModal(); (act.after || reload)(); };
        }, function (m) { openModal('<h2>' + esc(act.title) + '</h2>' + linesHtml([m], 'e') + '<button class="b s full" onclick="closeModal()">סגור</button>'); });
      };
    }, function (m) { openModal('<h2>' + esc(act.title) + '</h2>' + linesHtml([m], 'e') + '<button class="b s full" onclick="closeModal()">סגור</button>'); });
  }

  /**
   * טופס גנרי. fields = [{ k, label, type: text|number|date|select|check|file|textarea, options, value, hint }]
   * onSubmit(values, files) — files = { k: File }.
   */
  function formHtml(fields) {
    return fields.map(function (f) {
      var id = 'f-' + f.k.replace(/\W/g, '_') + '-' + fields.indexOf(f);
      f._id = id;
      var hint = f.hint ? '<div class="sub muted">' + esc(f.hint) + '</div>' : '';
      if (f.type === 'check') return '<div class="chk"><input type="checkbox" id="' + id + '"' + (f.value ? ' checked' : '') + (f.disabled ? ' disabled' : '') + '><span>' + esc(f.label) + '</span></div>' + hint;
      var lab = '<label for="' + id + '">' + esc(f.label) + '</label>';
      if (f.type === 'select') {
        return lab + '<select id="' + id + '">' + (f.blank ? '<option value=""></option>' : '') + f.options.map(function (o) {
          var v = typeof o === 'object' ? o.v : o, t = typeof o === 'object' ? o.t : o;
          return '<option value="' + esc(v) + '"' + (String(v) === String(f.value) ? ' selected' : '') + '>' + esc(t) + '</option>';
        }).join('') + '</select>' + hint;
      }
      if (f.type === 'textarea') return lab + '<textarea id="' + id + '" rows="2">' + esc(f.value) + '</textarea>' + hint;
      if (f.type === 'file') return lab + '<input type="file" id="' + id + '" accept="image/*,application/pdf">' + hint;

  // ---------- טעינה ----------
  /** skeleton בצורת המסך שייטען (בערך), כדי שהתוכן לא יקפוץ. */
  function skeleton(view) {
    var stat = '<div class="stat"><div class="sk l s"></div><div class="sk v"></div></div>';
    var card = function (n) { var r = ''; for (var i = 0; i < n; i++) r += '<div class="sk l' + (i % 3 === 0 ? ' m' : '') + '"></div>'; return '<div class="card"><div class="sk l s"></div>' + r + '</div>'; };

      '<div class="grid">' + stat + stat + stat + stat + '</div><div class="cols">' + pieCard + pieCard + '</div>' + card(4);
    if (view === 'my') return card(2) + pieCard + card(4);
    return card(6);
  }

  // ---------- גרפים (SVG, בלי ספרייה). צבע קבוע לכל שם; הסכומים מהשרת ----------
  var PALETTE = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
  var C_BUSINESS = '#374151', C_OTHER = '#9ca3af', MAX_SLICES = 8;
  function colorOf(key, colors) { return key === '__biz' ? C_BUSINESS : key === '__other' ? C_OTHER : PALETTE[((colors && colors[key]) || 0) % PALETTE.length]; }
  /** מעל 8 פרוסות → 7 הגדולות + "אחר". */
  function fold(slices) {
    if (slices.length <= MAX_SLICES) return slices;
    var rest = slices.slice(MAX_SLICES - 1), o = { key: '__other', label: 'אחר (' + rest.length + ')', amount: 0, pct: 0, videos: 0, projects: 0, missing: 0 };
    rest.forEach(function (x) { o.amount += x.amount; o.pct += x.pct; o.videos += x.videos || 0; o.projects += x.projects || 0; o.missing += x.missing || 0; });
    o.amount = Math.round(o.amount * 100) / 100; o.pct = Math.round(o.pct * 10) / 10;
    return slices.slice(0, MAX_SLICES - 1).concat([o]);
  }
  function donut(slices, colors, label) {
    var R = 86, r = 54, c = 90, total = slices.reduce(function (a, x) { return a + x.amount; }, 0), a0 = -Math.PI / 2;
    var pt = function (rad, a) { return (c + rad * Math.cos(a)).toFixed(2) + ' ' + (c + rad * Math.sin(a)).toFixed(2); };
    var paths = slices.map(function (x) {
      var tip = '<title>' + esc(x.label || x.key) + ': ' + money(x.amount) + ' (' + x.pct + '%)</title>', fill = ' fill="' + colors[x.key] + '"';
      if (slices.length === 1) return '<path' + fill + ' fill-rule="evenodd" d="M' + pt(R, 0) + ' A' + R + ' ' + R + ' 0 1 1 ' + pt(R, Math.PI) + ' A' + R + ' ' + R + ' 0 1 1 ' + pt(R, 0) +
        ' M' + pt(r, 0) + ' A' + r + ' ' + r + ' 0 1 0 ' + pt(r, Math.PI) + ' A' + r + ' ' + r + ' 0 1 0 ' + pt(r, 0) + 'Z">' + tip + '</path>';
      var a1 = a0 + 2 * Math.PI * x.amount / total, big = a1 - a0 > Math.PI ? 1 : 0;
      var d = 'M' + pt(R, a0) + ' A' + R + ' ' + R + ' 0 ' + big + ' 1 ' + pt(R, a1) + ' L' + pt(r, a1) + ' A' + r + ' ' + r + ' 0 ' + big + ' 0 ' + pt(r, a0) + 'Z';
      a0 = a1;
      return '<path' + fill + ' d="' + d + '">' + tip + '</path>';
    }).join('');
    return '<svg viewBox="0 0 180 180" role="img" aria-label="' + esc(label) + '">' + paths + '</svg>';
  }
  function counts(x) {
    var p = [];
    if (x.videos) p.push(x.videos + ' סרטונים');
    if (x.projects) p.push(x.projects + ' פרויקטים');
    return p.join(' · ');
  }
  /** עוגה + מקרא (שם, סכום, אחוז) + ניכויים. pie = { slices, deductions, total } מהשרת. */
  function pieBlock(pie, colors, label, opts) {
    opts = opts || {};
    var slices = fold(pie.slices.map(function (x) { return Object.assign({ label: opts.name ? opts.name(x) : x.key }, x); }));
    if (!slices.length && !(pie.deductions || []).length) return '<div class="muted" style="padding:20px 0">אין נתונים לתקופה</div>';
    // צבע לפי ישות; אם שתי ישויות באותה עוגה נופלות על אותו צבע (יותר מ-8) → הצבע הפנוי הבא
    var used = {}, col = {};
    slices.forEach(function (x) {
      var c = colorOf(x.key, colors), i = PALETTE.indexOf(c);
      for (var n = 0; i !== -1 && used[c] && n < PALETTE.length; n++) c = PALETTE[(i + n + 1) % PALETTE.length];
      used[c] = 1; col[x.key] = c;
    });
    var leg = slices.map(function (x) {
      var sub = counts(x) + (x.missing ? (counts(x) ? ' · ' : '') + '<span class="warn">' + x.missing + ' בלי סכום</span>' : '');
      return '<div class="row"><div class="main"><span class="sw" style="background:' + col[x.key] + '"></span>' + esc(x.label) +
        (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div><span class="num">' + money(x.amount) + '</span><span class="pct">' + x.pct + '%</span></div>';
    }).join('');
    var ded = (pie.deductions || []).map(function (x) {
      return '<div class="row"><div class="main muted">פחות: ' + esc(opts.name ? opts.name(x) : x.key) + '</div><span class="num err">−' + money(x.amount) + '</span></div>';
    }).join('');
    return (slices.length ? '<div class="pie">' + donut(slices, col, label) + '<div class="legend">' + leg + '</div></div>' : '') +
      (ded ? '<div class="ded">' + ded + '</div>' : '');
  }
  var PERIODS = [['month', 'החודש'], ['prev', 'חודש קודם'], ['year', 'השנה'], ['all', 'הכול']];
  S.period = 'month';
  function periodSeg(onPick) {
    setTimeout(function () {
      Array.prototype.forEach.call(document.querySelectorAll('.seg button[data-p]'), function (b) {
        b.onclick = function () { var y = window.scrollY; S.period = b.getAttribute('data-p'); onPick(); window.scrollTo(0, y); };
      });

  function renderMy(p) {

    var keys = {}; Object.keys(E.periods).forEach(function (k) { E.periods[k].slices.forEach(function (x) { keys[x.key] = 1; }); });
    Object.keys(keys).sort().forEach(function (k, i) { colors[k] = i; });
    setMain(
      '<div class="cols">' +
      '<div class="card"><h2>שלום ' + esc(p.name) + '</h2><div class="k muted">מגיע לך עכשיו</div><div class="big">' + money(p.due.amount) + '</div>' +

      '<div class="card"><h2>מאיפה הגיע הכסף שלי</h2>' + periodSeg(function () { renderMy(p); }) +
      '<div class="sub muted">' + esc(periodName(E.labels)) + ' · כולל מה שכבר שולם</div><div class="total">' + money(X.amount) + '</div>' + partial(X.missing) +
      '<div style="margin-top:6px"></div>' + pieBlock({ slices: X.slices, deductions: [], total: X.amount }, colors, 'הכסף שלי לפי לקוח') +
      (X.pending.length ? '<div class="ded">' + X.pending.map(function (x) {
        return '<div class="row"><div class="main muted">' + esc(x.key) + '<div class="sub">' + counts(x) + '</div></div><span class="warn sub">עוד בלי מחיר</span></div>';
      }).join('') + '</div>' : '') + '</div>' +
      '</div>' +
      sect('סרטונים שלא שולמו (' + p.videos.length + ')', Object.keys(byClient).sort().map(function (c) {
        return '<div class="sub" style="margin-top:8px"><b>' + esc(c) + '</b></div>' + byClient[c].map(function (v) {
          return '<div class="row"><div class="main">#' + esc(v.num) + ' <span class="sub">' + esc(v.type || '') + '</span></div><span class="num">' + money(v.amount) + '</span></div>';
        }).join('');
      }).join(''), true) +
      (p.projects.length ? sect('פרויקטים (' + p.projects.length + ')', p.projects.map(function (x) {
        return '<div class="row"><div class="main">' + esc(x.client) + ' — ' + esc(x.name) + '</div><span class="num">' + money(x.amount) + '</span></div>';
      }).join(''), true) : '') +
      sect('היסטוריית תשלומים', p.payments.map(function (x) {
        return '<div class="row"><div class="main">' + date(x.date) + ' · ' + x.count + ' פריטים<div class="sub">' +
          (x.hasInvoice ? '<span class="ok">חשבונית ✓</span>' : '<button class="b sm" onclick="myInvoice(' + esc(JSON.stringify(x.id)) + ')">העלאת חשבונית</button>') +
          '</div></div><b class="num">' + money(x.amount) + '</b></div>';
      }).join(''), true)
    );
  }
  function myInvoice(paymentId) {
    var fields = [{ k: 'file', label: 'קובץ חשבונית (PDF / תמונה)', type: 'file' }];
    openForm('העלאת חשבונית', fields, function (v, files) {
      if (!files.file) return formErr('לבחור קובץ');
      readFile(files.file, function (f) {
        runAct({ title: 'העלאת חשבונית', fn: 'editorUploadInvoice', args: function (cf) { return [getToken(), paymentId, f, cf]; }, after: myPage });
      });
    });
  }

  // ---------- התחלה ----------
  (function init() {
    var t = getToken();
    if (!t) return loginView();
    call('getCurrentUser', [t], function (r) {
      if (r.ok) return start(r.user);
      setToken(null); loginView();
    }, function () { setToken(null); loginView(); });
  })();
</script>
</body>
</html>
