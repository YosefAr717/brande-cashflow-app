var W = 1080, P = 72, FF = '-apple-system, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans Hebrew", "Arial Hebrew", Arial, sans-serif';
var C = { ink: '#1c1c1e', sec: '#6e6e73', line: '#d1d1d6', accent: '#0a7aff', band: '#f2f2f7', warn: '#b25000', bg: '#ffffff' };
var cv = document.createElement('canvas'), ctx = cv.getContext('2d'), ops = [], y = P;
cv.setAttribute('dir', 'rtl'); cv.className = 'rc-tmp'; document.body.appendChild(cv);
var font = function (px, w) { return (w || 400) + ' ' + px + 'px ' + FF; };
var width = function (t, f) { ctx.font = f; return ctx.measureText(t).width; };
var text = function (t, side, f, c, dir, max) { ops.push({ k: 't', t: String(t), side: side, y: y, f: f, c: c, d: dir || (side === 'left' ? 'ltr' : 'rtl'), max: max }); };
var rule = function () { ops.push({ k: 'r', y: y }); };
var day = function (s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : String(s || '—'); };
var row = function (label, value, f, vf, vc) {
var fv = vf || font(36, 600), room = W - 2 * P - width(value, fv) - 32;
text(label, 'right', f || font(34), C.ink, 'rtl', room); text(value, 'left', fv, vc || C.ink, 'ltr');
};
y += 52; text('Brande', 'right', font(60, 800), C.accent, 'ltr');
y += 58; text('אסמכתת תשלום', 'right', font(42, 700), C.ink);
y += 36; rule();
[['מזהה תשלום', r.id, 'ltr'], ['תאריך', day(r.date), 'ltr'], ['עורך', r.editor, 'rtl']].concat(r.paidBy ? [['שולם על ידי', r.paidBy, 'rtl']] : []).forEach(function (m) {
y += 54; text(m[0], 'right', font(32), C.sec); text(m[1], 'left', font(34, 600), C.ink, m[2]);
});
y += 36; rule();
if (r.noItems) { y += 64; text('פירוט פריטים לא זמין', 'right', font(34), C.sec); }
(r.groups || []).forEach(function (g) {
y += 74; text(g.client, 'right', font(38, 700), C.ink);
g.lines.forEach(function (l) {
var v = l.unit !== null ? l.count + ' × ' + money(l.unit) + ' = ' + money(l.total) : '';
y += 54;
if (v) row(l.type, v, font(34), font(34, 600));
else { text(l.type, 'right', font(34), C.ink); text(l.missing === l.count ? 'עלות לא ידועה' : money(l.total) + ' + לא ידוע', 'left', font(32, 600), C.warn, 'rtl'); }
var parts = l.nums.map(function (n) { return '#' + n; }), cur = '', lines = [], f2 = font(30);
parts.forEach(function (x) { var t = cur ? cur + '  ' + x : x; if (cur && width(t, f2) > W - 2 * P) { lines.push(cur); cur = x; } else cur = t; });
if (cur) lines.push(cur);
lines.forEach(function (t) { y += 42; text(t, 'right', f2, C.sec, 'ltr'); });
});
});
if ((r.projects || []).length) {
y += 74; text('פרויקטים', 'right', font(38, 700), C.ink);
r.projects.forEach(function (x) {
y += 54;
if (x.cost === null) { text(x.client + ' · ' + x.name, 'right', font(34), C.ink); text('עלות לא ידועה', 'left', font(32, 600), C.warn, 'rtl'); }
else row(x.client + ' · ' + x.name, money(x.cost), font(34), font(34, 600));
});
}
y += 44; rule();
if (!r.noItems) { y += 58; row('סה״כ פריטים', money(r.itemsTotal)); }
if (r.missing) { y += 44; text(r.missing + ' פריטים בלי עלות ידועה', 'right', font(28), C.warn); }
if (r.bonus) { y += 58; row('בונוס', money(r.bonus)); }
if (r.adjustment) {
y += 58; row('התאמה', (r.adjustment > 0 ? '+' : '−') + money(Math.abs(r.adjustment)), null, null, C.warn);
y += 40; text('הפרש בין הסכום שנרשם לסכום הפריטים', 'right', font(26), C.sec);
}
y += 36; ops.push({ k: 'b', y: y, h: 108 });
y += 70; row('סה״כ שולם', money(r.amount), font(40, 700), font(52, 800), C.accent);
y += 38 + 56; text('Brande CashFlow', 'right', font(24), C.sec, 'ltr');
cv.width = W; cv.height = Math.ceil(y + P - 20);
ctx.fillStyle = C.bg; ctx.fillRect(0, 0, cv.width, cv.height);
ops.forEach(function (o) {
if (o.k === 'r') { ctx.fillStyle = C.line; ctx.fillRect(P, o.y, W - 2 * P, 2); return; }
if (o.k === 'b') { ctx.fillStyle = C.band; ctx.fillRect(P - 24, o.y, W - 2 * P + 48, o.h); return; }
ctx.font = o.f; ctx.fillStyle = o.c; ctx.textBaseline = 'alphabetic';
if ('direction' in ctx) ctx.direction = o.d;
ctx.textAlign = o.side;
var x = o.side === 'right' ? W - P : P;
if (o.max && o.max > 40) ctx.fillText(o.t, x, o.y, o.max); else ctx.fillText(o.t, x, o.y);
});
cv.remove(); cv.className = '';
return cv;
}
function myPage() {
S.screen = { t: 'שלום', large: 1 };
var snapPage = S.mySnap; S.mySnap = null;
if (snapPage) { S.renderSrc = 'snapshot'; renderMy(snapPage); setSync(true); }
else setMain(skeleton('my'));
call('getMyPage', [getToken()], function (r) {
S.snapAt = null; setSync(false);
if (!r.ok && S.boot) { S.boot = false; setRole(null); return bootSlow(); }
if (!r.ok) return setMain('<div class="msg e">' + esc(r.message) + '</div>' + logoutGroup());
saveSnap('editor', { page: r.page });
if (snapPage && JSON.stringify(snapPage) === JSON.stringify(r.page)) return;
S.renderSrc = 'שרת';
var y = snapPage ? window.scrollY : 0;
renderMy(r.page);
if (snapPage) window.scrollTo(0, y);
}, function (m) {
setSync(false);
if (snapPage) { S.mySnap = snapPage; return setStale(S.snapAt, myPage); }
toastErr(m, myPage);
});
}
function renderMy(p) {
var items = p.videos.map(function (v) { return { kind: 'v', client: v.client, type: v.type || 'בלי סוג', num: v.num, date: '', amount: v.amount }; })
.concat(p.projects.map(function (x) { return { kind: 'p', client: x.client, pname: x.name, amount: x.amount }; }));
var E = p.earnings, X = E.periods[S.period], colors = {};
var keys = {}; Object.keys(E.periods).forEach(function (k) { E.periods[k].slices.concat(E.periods[k].deductions || []).forEach(function (x) { keys[x.key] = 1; }); });
Object.keys(keys).sort().forEach(function (k, i) { colors[k] = i; });
S.screen = { t: 'שלום ' + p.name, large: 1 };
setMain(
hero('מגיע לך עכשיו', money(p.due.amount), nOf(p.due.count, 'פריט', 'פריטים') + ' מאז התשלום האחרון') +
(p.due.missing ? '<div class="msg w t-sub">' + nOf(p.due.missing, 'פריט', 'פריטים') + ' עוד בלי מחיר. הסכום יתעדכן כשיוסף ישלים.</div>' : '') +
openList(items) +
pieGrp('הכסף שלי לפי לקוח · ' + esc(periodShort(E.labels)),
periodSeg(E.labels, function () { renderMy(p); }) + '<div class="pie-gap"></div>' +
pieBlock({ slices: X.slices, deductions: X.deductions, total: X.amount }, colors, 'הכסף שלי לפי לקוח, ' + periodName(E.labels), { totalLabel: 'שולם לך' }) +
(X.missing ? '<p class="calc t-foot sec">' + nOf(X.missing, 'תשלום', 'תשלומים') + ' בלי סכום תקין (לא בעוגה)</p>' : ''),
'לפי מה ששולם לך בתקופה') +
sect('היסטוריית תשלומים', p.payments.map(function (x) {
return '<div class="row"><div class="main"><div class="t-body">' + date(x.date) + ' · ' + nOf(x.count, 'פריט', 'פריטים') + '</div><div class="t-foot">' +
(x.kept ? KEPT_TXT : x.hasInvoice ? '<span class="ok">חשבונית ✓</span>' : '<span class="warn">⚠︎ אין חשבונית</span>') + '</div>' +
(x.hasInvoice || x.kept ? '' : '<button class="btn-plain t-sub inl ia" onclick="myInvoice(' + esc(JSON.stringify(x.id)) + ')">' + ic('doc') + 'העלאת חשבונית</button>') +
(isOpeningPay(x.id) ? '' : '<button class="btn-plain t-sub inl ia" data-rc="' + esc(x.id) + '">' + ic('receipt') + 'אסמכתא</button>') + '</div>' + paidVal(x.amount, x.bonus) + '</div>';
}).join(''), true) +
grp('תצוגה', themeRow()) +
logoutGroup()
);
Array.prototype.forEach.call(document.querySelectorAll('[data-rc]'), function (b) { b.onclick = function () { receiptOpen(b.getAttribute('data-rc')); }; });
markPaint();
}
function myInvoice(paymentId) {
var fields = [{ k: 'file', label: 'קובץ חשבונית (PDF / תמונה)', type: 'file' }];
openForm('העלאת חשבונית', fields, function (v, files) {
if (!files.file) return formErr('לבחור קובץ');
readFile(files.file, function (f) {
runAct({ title: 'העלאת חשבונית', fn: 'editorUploadInvoice', args: function (cf) { return [getToken(), paymentId, cf ? f : { name: f.name, mimeType: f.mimeType }, cf]; }, after: myPage });
});
});
}
function bootSlow() {
var t = getToken();
if (!t) return loginView();
call('getCurrentUser', [t], function (r) {
if (r.ok) return start(r.user);
setToken(null); loginView();
}, function () { setToken(null); loginView(); });
}
(function init() {
var t = getToken(), role = getRole();
if (!t) return loginView();

if (snap && snap.role !== role) snap = null;
if (role === 'admin') {
S.boot = true; $('nav').classList.remove('hidden'); setTimeout(movePill);
if (snap && snap.data && snap.data.home) {

}
if (role === 'editor') {

if (snap && snap.data && snap.data.page) { S.mySnap = snap.data.page; S.snapAt = snap.at; }

}
bootSlow();
})();
